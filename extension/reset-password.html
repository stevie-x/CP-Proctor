<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 350px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h2 { color: #569cd6; margin: 0 0 20px 0; text-align: center; }
    label { font-size: 12px; color: #aaa; }
    input {
      width: 100%;
      padding: 8px;
      margin: 6px 0 12px 0;
      background: #2d2d2d;
      border: 1px solid #444;
      color: #d4d4d4;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input.mismatch { border-color: #f44747; }
    button {
      width: 100%;
      padding: 10px;
      background: #569cd6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }
    .success { background: #1e4d2b; color: #4ec9b0; display: block !important; }
    .error { background: #4d1e1e; color: #f44747; display: block !important; }
    #mismatchHint { color: #f44747; font-size: 11px; margin: -8px 0 8px 0; display: none; }
  </style>
</head>
<body>
  <h2>Reset Password</h2>
  <div id="formPanel">
    <label>New Password</label>
    <input type="password" id="newPassword" placeholder="••••••••" />
    <label>Confirm New Password</label>
    <input type="password" id="confirmNewPassword" placeholder="••••••••" />
    <div id="mismatchHint">Passwords don't match.</div>
    <button id="resetBtn">Set New Password</button>
  </div>
  <div id="status"></div>
  <script src="reset-password.js"></script>
</body>
</html>
